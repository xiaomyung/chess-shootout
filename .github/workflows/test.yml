name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt imageio-ffmpeg

      - name: Expose ffmpeg on PATH (for pydub)
        run: |
          SRC=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p "$HOME/.bin"
          ln -sf "$SRC" "$HOME/.bin/ffmpeg"
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: pytest tests -n auto -q
