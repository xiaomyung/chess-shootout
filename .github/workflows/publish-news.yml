name: publish-news

on:
  push:
    branches: [master]
    paths: ["news.json"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Stamp the release date on the newest item
        run: |
          python - <<'PY'
          import datetime
          import json
          items = json.load(open("news.json", encoding="utf-8"))
          if items:
              items[0]["date"] = datetime.date.today().isoformat()
              with open("news.json", "w", encoding="utf-8") as handle:
                  json.dump(items, handle, indent=2, ensure_ascii=False)
                  handle.write("\n")
          PY

      - name: Stage site
        run: |
          mkdir -p site
          cp news.json site/news.json

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
