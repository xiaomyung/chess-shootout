name: chrome-validation

# Borderless-chrome gate. Run manually before relying on the custom window
# chrome in a release: builds the frozen binary on each OS (catches a missing
# pygame._sdl2 hidden import or a build break) and runs a headless self-check
# that the ctypes SDL hit-test shim loads and resolves the SDL_Window pointer.
# Interactive drag/resize/maximize is validated by hand on a real desktop.

on:
  workflow_dispatch:

jobs:
  chrome:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .[build]

      - name: Validate SDL hit-test shim loads (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/chrome_selfcheck.py

      - name: Build frozen binary (onedir)
        run: pyinstaller chess.spec
