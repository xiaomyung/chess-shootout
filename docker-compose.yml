name: chess-shootout-gameserver

services:
  gameserver:
    image: ghcr.io/xiaomyung/chess-shootout-gameserver:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 10s
    env_file:
      - path: ./gameserver.env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      TRUSTED_PROXIES: "172.30.0.3/32"
      CHESS_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      edge:
        aliases:
          - chess-gameserver
    volumes:
      - gameserver-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true

volumes:
  gameserver-data:
