name: chess-shootout-gameserver

services:
  gameserver:
    image: ghcr.io/xiaomyung/chess-shootout-gameserver:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 10s
    env_file:
      - path: ./gameserver.env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      TRUSTED_PROXIES: "172.28.0.2/32"
      CHESS_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      chess-net:
        ipv4_address: 172.28.0.10
    volumes:
      - gameserver-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      gameserver:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      chess-net:
        ipv4_address: 172.28.0.2
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    secrets:
      - cf_origin_cert
      - cf_origin_key
      - cf_aop_ca
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chess-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  gameserver-data:
  caddy-data:
  caddy-config:

secrets:
  cf_origin_cert:
    file: ./secrets/cf_origin_cert.pem
  cf_origin_key:
    file: ./secrets/cf_origin_key.pem
  cf_aop_ca:
    file: ./secrets/cf_aop_ca.pem
