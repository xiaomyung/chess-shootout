[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-shootout"
version = "1.0.0"
description = "Full-featured local and online chess built with pygame"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Xiao Myung", email = "xiaomyung.dev@gmail.com" }]
keywords = ["chess", "pygame", "game", "online", "multiplayer"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "pygame==2.6.1",
    "pydantic==2.13.4",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "websockets==16.0",
    "platformdirs==4.10.0",
]

[project.optional-dependencies]
server = [
    "fastapi[standard]==0.115.6",
    "slowapi==0.1.9",
]
dev = [
    "chess-shootout[server]",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "pytest-asyncio==1.3.0",
    "pylama~=8.4",
    "setuptools<81",
    "toml~=0.10",
]
build = [
    "pyinstaller>=6.11,<7",
    "pillow>=11,<12",
]

[project.urls]
Homepage = "https://github.com/xiaomyung/chess-shootout"
Issues = "https://github.com/xiaomyung/chess-shootout/issues"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend", "pieces", "server"]

[tool.pylama]
linters = "pycodestyle,pyflakes"
max_line_length = 100
ignore = "E127"

[[tool.pylama.files]]
path = "tests/*"
ignore = "E402"
